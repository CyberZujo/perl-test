name: Perl tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install test dependencies
        run: cpanm --notest Test::More TAP::Formatter::JUnit

      - name: Run tests and generate JUnit report
        shell: bash
        run: |
          mkdir -p test-results
          prove -Iauthorization -Ilib -r \
            --formatter TAP::Formatter::JUnit \
            t > test-results/junit.xml

      - name: Show failed tests in GitHub
        if: ${{ !cancelled() && hashFiles('test-results/junit.xml') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Perl test results
          path: test-results/junit.xml
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          use-actions-summary: "true"
          fail-on-error: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perl-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
