name: Perl Test and Trigger Harness

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Run tests
        run: prove -Iauthorization -Ilib -rv t

      - name: Trigger Harness pipeline
        env:
          HARNESS_WEBHOOK_URL: ${{ secrets.HARNESS_WEBHOOK_URL }}
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          : "${HARNESS_WEBHOOK_URL:?Missing HARNESS_WEBHOOK_URL secret}"

          headers=(-H "Content-Type: application/json")

          if [[ -n "$HARNESS_API_KEY" ]]; then
            headers+=(-H "X-Api-Key: $HARNESS_API_KEY")
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --request POST \
            "${headers[@]}" \
            --data '{"source":"github-actions"}' \
            "$HARNESS_WEBHOOK_URL"
